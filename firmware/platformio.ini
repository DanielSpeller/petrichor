[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<hal/moisture_sensor.cpp>
    +<hal/pump_relay.cpp>
    +<hal/clock.cpp>
    +<watering_controller.cpp>
    +<schedule.cpp>
    +<watchdog.cpp>
    +<wifi_manager.cpp>
    +<pump_runner.cpp>
    +<request_id_history.cpp>
    +<config_store.cpp>
    +<ota_handler.cpp>
